<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema de Viáticos - UNSL</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }
    .login-header {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 30px 24px 20px;
      text-align: center;
    }
    .login-logo {
      height: 64px;
      width: auto;
      margin-bottom: 12px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }
    .login-body {
      padding: 30px 28px;
    }
    .form-control-login {
      border: 1.5px solid #cbd5e1;
      padding: 10px 14px 10px 42px;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .form-control-login:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      outline: none;
    }
    .input-icon-wrapper {
      position: relative;
    }
    .input-icon-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 1.1rem;
    }
    .btn-login {
      background-color: #1e3a8a;
      border-color: #1e3a8a;
      color: white;
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .btn-login:hover {
      background-color: #172554;
      border-color: #172554;
      color: white;
      box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.3);
    }
    .credentials-box {
      background-color: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.82rem;
      color: #475569;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <img src="{{ url_for('static', filename='img/unsl_logo.jpg') }}" alt="Escudo UNSL" class="login-logo">
      <h5 class="fw-bold mb-1 text-dark" style="font-size: 0.95rem; letter-spacing: 0.03em;">UNIVERSIDAD NACIONAL DE SAN LUIS</h5>
      <p class="text-muted small mb-0 fw-semibold">Facultad de Ciencias Económicas, Jurídicas y Sociales</p>
      <div class="badge bg-primary text-white mt-2 px-3 py-1 fw-semibold">SISTEMA DE VIÁTICOS</div>
    </div>

    <div class="login-body">
      {% if error %}
      <div class="alert alert-danger d-flex align-items-center py-2 px-3 small" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
        <div>{{ error }}</div>
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary">Usuario</label>
          <div class="input-icon-wrapper">
            <i class="bi bi-person"></i>
            <input type="text" name="username" class="form-control form-control-login" placeholder="Ingrese su usuario" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold text-secondary">Contraseña</label>
          <div class="input-icon-wrapper">
            <i class="bi bi-lock"></i>
            <input type="password" name="password" class="form-control form-control-login" placeholder="Ingrese su contraseña" required>
          </div>
        </div>

        <button type="submit" class="btn btn-login w-100 mb-2">
          <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
        </button>
      </form>

      <div class="credentials-box">
        <div class="fw-bold mb-1 text-dark"><i class="bi bi-info-circle me-1 text-primary"></i> Usuarios autorizados:</div>
        <div class="d-flex justify-content-between">
          <span>Usuario: <code>admin</code></span>
          <span>Clave: <code>admin2026</code></span>
        </div>
        <div class="d-flex justify-content-between">
          <span>Usuario: <code>secretaria</code></span>
          <span>Clave: <code>secretaria2026</code></span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
